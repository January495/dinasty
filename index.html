ставе",text:"Мытник у заставы требует втрое против обычного: «Новый указ». Указа он, конечно, не показывает.",weight:0,options:[{text:"Заплатить",effects:[{t:"caravan",v:-.15}],result:"Заплатили. Дорога открыта."},{text:"Сунуть ему лично — меньше",effects:[{t:"chance",p:.7,ok:[{t:"caravan",v:-.05}],fail:[{t:"caravan",v:-.3}],okText:"Мытник подобрел.",failText:"Его начальник всё видел. Штраф и пошлина."}]},{text:"Торговаться",effects:[{t:"check",s:"diplomacy",dc:8,ok:[],fail:[{t:"caravan",v:-.2}],okText:"Сошлись на обычной цене.",failText:"Мытник обиделся и взял ещё больше."}]}]},{id:"caravan_river",title:"Разлив реки",text:"Брод залило после дождей. Паромщик просит дорого, а до моста три дня пути.",weight:0,options:[{text:"Платить паромщику",effects:[{t:"caravan",v:-.08}],result:"Переправились."},{text:"Идти вброд",effects:[{t:"chance",p:.65,ok:[],fail:[{t:"caravan",v:-.3}],okText:"Прошли, только вымочили тюки.",failText:"Воз унесло течением."}]},{text:"Делать крюк к мосту",effects:[{t:"caravan",v:-.05}],result:"Потеряли время — на рынок пришли позже других."}]},{id:"caravan_beast",title:"Падёж",text:"Кони один за другим ложатся: то ли корм дурной, то ли хворь.",weight:0,options:[{text:"Купить новых втридорога",effects:[{t:"caravan",v:-.15}],result:"Купили у местных — дорого, но едем."},{text:"Бросить часть груза",effects:[{t:"caravan",v:-.3}],result:"Оставили что потяжелее."},{text:"Лечить самим",effects:[{t:"check",s:"learning",dc:8,ok:[],fail:[{t:"caravan",v:-.35}],okText:"Отпоили — кони встали.",failText:"Не помогло."}]}]},{id:"caravan_fair",title:"Большая ярмарка",text:"По пути — ярмарка, и на ваш товар большой спрос. Можно распродать часть здесь или везти всё дальше, где дороже.",weight:0,options:[{text:"Продать часть здесь",effects:[{t:"caravan",v:.1}],result:"Хороший торг, меньше риска в дороге."},{text:"Сторговать оптом с местным купцом",effects:[{t:"check",s:"stewardship",dc:9,ok:[{t:"caravan",v:.35}],fail:[{t:"caravan",v:-.1}],okText:"Отличная сделка!",failText:"Купец оказался хитрее."}]},{text:"Не задерживаться",effects:[],result:"Идём дальше."}]},{id:"caravan_stranger",title:"Попутчик",text:"К каравану просится путник: говорит, знает короткую дорогу и здешних людей.",weight:0,options:[{text:"Взять проводником",effects:[{t:"chance",p:.6,ok:[{t:"caravan",v:.15},{t:"learn",n:1,level:2}],fail:[{t:"caravan",v:-.4}],okText:"Короткой дорогой пришли раньше всех.",failText:"Он привёл прямо к своим дружкам-разбойникам."}]},{text:"Отказать",effects:[],result:"Береженого бог бережёт."}]},{id:"caravan_fever",title:"Лихорадка в пути",text:"Люди в караване мечутся в жару. Вы и сами чувствуете озноб.",weight:0,options:[{text:"Встать и переждать",effects:[{t:"caravan",v:-.1},{t:"health",v:-1}],result:"Отлежались. Потеряли время."},{text:"Идти дальше через силу",effects:[{t:"chance",p:.8,ok:[{t:"health",v:-2}],fail:[{t:"die",cause:"умер от лихорадки в пути с караваном"}],okText:"Дошли, но вы еле на ногах.",failText:"Дорога стала последней."}]}]},{id:"caravan_storm",title:"Шторм",text:"Ветер рвёт паруса, волны заливают палубу. Кормчий кричит: «Груз за борт, или пойдём ко дну!»",weight:0,options:[{text:"Выбросить часть груза",effects:[{t:"caravan",v:-.4}],result:"Корабль выдержал."},{text:"Держаться до конца",effects:[{t:"chance",p:.6,ok:[],fail:[{t:"caravan",v:"lost"},{t:"chance",p:.4,ok:[{t:"die",cause:"утонул в шторм с торговым кораблём"}],fail:[]}],okText:"Шторм утих. Груз цел!",failText:"Корабль разбило. Груз погиб."}]}]},{id:"caravan_pirates",title:"Чужой парус",text:"На горизонте — быстрый корабль без флага. Он идёт наперерез.",weight:0,options:[{text:"Уходить на всех парусах",effects:[{t:"chance",p:.55,ok:[],fail:[{t:"caravan",v:-.6}],okText:"Ушли!",failText:"Догнали и обобрали."}]},{text:"Готовиться к бою",effects:[{t:"caravanFight",sea:!0}]},{text:"Откупиться",effects:[{t:"caravan",v:-.35}],result:"Взяли выкуп и отпустили."}]},{id:"robbers_gang",title:"Шайка у ворот",weight:0,text:"Ваше богатство давно на слуху, а стража отвадила мелких воришек. Теперь пришли другие: ночью у ворот — вооружённая шайка, не деревенские голодранцы, а люди, которые знают своё дело. Говорят, их навёл кто-то из своих.",options:[{text:"Стража — к оружию! Держать ворота",effects:[{t:"guardFight"}]},{text:"Послать гонца к сеньору за подмогой и держаться",cond:{rank:[2,7]},effects:[{t:"guardFight",lord:!0},{t:"wealthPct",v:-.03}],result:"Люди сеньора пришли — за помощь придётся отблагодарить."},{text:"Откупиться, пока не пролилась кровь",effects:[{t:"wealthPct",v:-.12}],result:"Шайка взяла выкуп и ушла. Пока."},{text:"Бежать с семьёй через задний двор",effects:[{t:"wealthPct",v:-.35}],result:"Все живы. Дом разграблен."}],cond:{year:[800,1800]}},{id:"heiress_choice",title:"Наследница",weight:0,text:"Мужчин в роду не осталось — род держится на вас. Но вы замужем за {target}, а дети по обычаю считаются в роду отца. Так угасали многие роды: имя уходило вместе с последней дочерью. Был и другой путь — муж входит в дом жены, как зять-примак (у японцев — мукоёси), и дети носят её родовое имя.",options:[{text:"Уговорить мужа войти в наш род",effects:[{t:"check",s:"diplomacy",dc:7,ok:[{t:"matriline",v:"join"},{t:"opinion",v:-10,to:"target"}],fail:[{t:"matriline",v:"join"},{t:"opinion",v:-30,to:"target"},{t:"prestige",v:-5}],okText:"Муж согласился: «Твой род — мой род».",failText:"Муж согласился, но затаил обиду: над ним смеются, что живёт у жены."}]},{text:"Отказаться от имени рода — пусть дети будут его рода",effects:[{t:"matriline",v:"husband"}],result:"Вы остаётесь главой, пока живы. Наследство уйдёт детям в род мужа."}]},{id:"trouble_war",title:"В земле война",text:"По дорогам идут чужие и свои войска, и неизвестно, кто страшнее. Горят соседские амбары, на постоялых дворах говорят только о войне. Как роду пережить лихие годы?",weight:0,options:[{text:"Идти воевать: добыча и слава",cond:{gender:"m",age:[16,50]},effects:[{t:"check",s:"martial",dc:7,ok:[{t:"prestige",v:8},{t:"income",v:.6},{t:"stat",s:"martial",v:1}],fail:[{t:"chance",p:.2,ok:[{t:"die",cause:"пал в бою"}],fail:[{t:"trait",add:"wounded"},{t:"prestige",v:2}]}],okText:"Вы вернулись живым, с добычей и рассказами.",failText:"Война обошлась дорого."}]},{text:"Торговать с войском: хлеб, кони, сукно",cond:{rank:[1,7]},effects:[{t:"check",s:"stewardship",dc:7,ok:[{t:"income",v:.7}],fail:[{t:"income",v:-.3},{t:"opinion",v:-10,to:"lord"}],okText:"Интенданты платят щедро: война — время подрядчиков.",failText:"Обоз реквизировали «для нужд войска», заплатить забыли."}]},{text:"Укрыть семью и добро за стенами",cond:{rank:[2,7]},effects:[{t:"income",v:-.3},{t:"log",text:"Добро свезли в город за стены, семья пересидела смуту там."}]},{text:"Затаиться и переждать",effects:[{t:"chance",p:.3,ok:[{t:"wealthPct",v:-.15}],fail:[],okText:"Солдаты всё же нашли погреб.",failText:"Пронесло: войска прошли стороной."}]}]},{id:"trouble_plague",title:"Мор",text:"В городе и окрестных деревнях умирают целыми домами. Лекари бессильны, священники не успевают отпевать. Что делать?",weight:0,options:[{text:"Бежать с семьёй подальше от людей",cond:{wealth:5},effects:[{t:"income",v:-.4},{t:"flag",v:"fled_plague"},{t:"log",text:"Кто мог — бежал из городов: так спасалась знать, а рассказчики «Декамерона» Боккаччо пережидали чуму на вилле."}]},{text:"Запереться дома и молиться",effects:[{t:"chance",p:.15,ok:[{t:"trait",add:"pious"}],fail:[],okText:"Молитва в страхе сделала вас набожнее."}]},{text:"Ходить за больными соседями",effects:[{t:"chance",p:.15,ok:[{t:"die",cause:"умер(ла) от мора, ухаживая за больными"}],fail:[{t:"prestige",v:12},{t:"opinion",v:10,to:"family"}],okText:"Мор забрал и вас.",failText:"Вас не тронуло — люди этого не забудут."}]}]},{id:"trouble_famine",title:"Голод",text:"Урожай погиб, цены на хлеб растут каждую неделю. В деревнях едят лебеду и кору, на дорогах — нищие.",weight:0,options:[{text:"Открыть амбары голодным",cond:{rank:[2,7]},effects:[{t:"income",v:-.5},{t:"prestige",v:12},{t:"opinion",v:6,to:"family"}]},{text:"Придержать зерно и продать втридорога",cond:{rank:[1,7]},effects:[{t:"income",v:.8},{t:"prestige",v:-10},{t:"chance",p:.25,ok:[{t:"relation",rel:"rival",role:"neighbor"}],fail:[],okText:"Сосед этого вам не простит."}]},{text:"Затянуть пояса всей семьёй",effects:[{t:"income",v:-.15},{t:"health",v:-1}]}]},{id:"land_converts",title:"Земля меняет веру",text:"Правитель и знать приняли новую веру, за ними — города и сёла. Старой вере молятся теперь тайком, а служители новой спрашивают, какой веры ваш дом.",weight:0,options:[{text:"Принять веру земли",effects:[{t:"religion",v:"local"},{t:"prestige",v:3},{t:"opinion",v:10,to:"lord"}],result:"Род принял новую веру вместе со всеми."},{text:"Держаться веры отцов",effects:[{t:"flag",v:"foreign_faith"},{t:"prestige",v:-5},{t:"opinion",v:-15,to:"lord"}],result:"Вы остаётесь при старой вере — и при поборах, косых взглядах и подозрениях."}]},{id:"inherit_dispute",title:"Спор о наследстве",weight:0,text:"{target} не признаёт, что всё досталось вам: «Отец обещал мне долю!» За ним — часть родни и пара свидетелей. Дело может дойти до суда, а то и до ножа.",options:[{text:"Откупиться долей (15% казны)",effects:[{t:"wealthPct",v:-.15},{t:"opinion",v:25,to:"target"}],result:"{target} берёт деньги и уезжает. Мир в семье дороже."},{text:"Пусть рассудит суд",effects:[{t:"check",s:"diplomacy",dc:7,ok:[{t:"prestige",v:6},{t:"opinion",v:-20,to:"target"}],fail:[{t:"wealthPct",v:-.3},{t:"prestige",v:-6},{t:"opinion",v:-10,to:"target"}],okText:"Судья на вашей стороне: завещание и обычай за вами.",failText:"Свидетели {target} оказались убедительнее: суд отдаёт ему треть казны."}]},{text:"Выгнать из дома",effects:[{t:"relation",rel:"rival"},{t:"prestige",v:-3},{t:"opinion",v:-10,to:"family"}],result:"{target} уходит, проклиная вас. Теперь у вас враг из своей крови."}]},{id:"young_head_test",title:"Соседи проверяют юного главу",weight:6,cooldown:12,cond:{age:[12,19],year:[800,1900],rank:[0,4]},text:"Едва вы стали главой рода, сосед передвинул межевые камни и запахал вашу полосу: «Молод ещё — не заметит».",options:[{text:"Стерпеть",effects:[{t:"income",v:-.2},{t:"prestige",v:-3}],result:"Межа ушла. Соседи запомнили, что вас можно теснить."},{text:"Собрать своих людей и вернуть камни",effects:[{t:"check",s:"martial",dc:6,ok:[{t:"prestige",v:8}],fail:[{t:"health",v:-1},{t:"prestige",v:-2}],okText:"Сосед отступил: юный глава — не лёгкая добыча.",failText:"Дело кончилось дракой, и вам досталось."}]},{text:"Пожаловаться сюзерену",effects:[{t:"opinion",v:-5,to:"lord"},{t:"income",v:.05}],result:"Сюзерен велит вернуть межу, но ворчит: «Сам должен уметь»."}]},{id:"young_head_steward",title:"Старый слуга отца",weight:5,cooldown:20,cond:{age:[12,19],rank:[2,7]},text:"Старый приказчик, служивший ещё вашему отцу, предлагает каждый вечер учить вас вести счета и дела рода.",options:[{text:"Учиться у него",effects:[{t:"stat",s:"stewardship",v:1}],result:"Скучно, но вы начинаете понимать, откуда берутся деньги."},{text:"«Сам разберусь»",effects:[{t:"prestige",v:2},{t:"chance",p:.3,ok:[{t:"income",v:-.2}],fail:[],okText:"Без присмотра приказчики подворовывают.",failText:""}],result:"Вы гордо отказываетесь."}]},{id:"young_head_feast",title:"Первый пир хозяина",weight:5,cooldown:20,cond:{age:[14,20],rank:[1,7],year:[800,1900]},text:"По обычаю новый глава рода созывает соседей на пир. Все будут смотреть, как держится юный хозяин.",options:[{text:"Устроить пир как подобает",effects:[{t:"income",v:-.15},{t:"check",s:"diplomacy",dc:5,ok:[{t:"prestige",v:8}],fail:[{t:"prestige",v:-3}],okText:"Вы держались достойно: о новом хозяине говорят с уважением.",failText:"Вы смутились и ляпнули глупость — над этим посмеиваются."}]},{text:"Скромно, без пира",effects:[{t:"prestige",v:-2}],result:"Соседи решили, что вы скупитесь, зато казна цела."}]},{id:"woman_midwife",title:"Тяжёлые роды у соседки",weight:4,cooldown:10,cond:{gender:"f",age:[18,60],year:[800,1900]},text:"Ночью прибегают от соседей: роженица мучается вторые сутки, повитуха растерялась. Зовут вас — вы ведь знаете толк в травах и родах.",options:[{text:"Пойти помочь",effects:[{t:"check",s:"learning",dc:5,ok:[{t:"prestige",v:6},{t:"opinion",v:15,to:"neighbor"}],fail:[{t:"prestige",v:-2}],okText:"Мать и дитя живы. Соседи вам обязаны.",failText:"Ребёнка спасти не удалось. Кто-то уже шепчет, что вы «сглазили»."}]},{text:"Не вмешиваться",effects:[{t:"opinion",v:-10,to:"neighbor"}],result:"Соседи вам этого не простят."}]},{id:"woman_business",title:"«С бабой дел не ведём»",weight:4,cooldown:15,cond:{gender:"f",age:[18,70],year:[800,1920],hasBusiness:!0},text:"Купцы на торгу отказываются заключать сделку с женщиной без мужа или брата: «Пусть придёт мужчина из вашего рода».",options:[{text:"Послать родича вести переговоры",effects:[{t:"income",v:-.05}],result:"Сделка заключена, но родич взял себе долю."},{text:"Настоять и торговаться самой",effects:[{t:"check",s:"diplomacy",dc:7,ok:[{t:"income",v:.25},{t:"prestige",v:5}],fail:[{t:"income",v:-.1}],okText:"Купцы ворчат, но платят: с вами выгоднее, чем без вас.",failText:"Купцы уходят к другим. Обычай сильнее."}]}]},{id:"woman_widow",title:"Вдова во главе рода",weight:4,cooldown:30,cond:{gender:"f",married:!1,age:[25,70],year:[800,1900]},text:"Родня покойного мужа считает, что вдове не пристало держать хозяйство: «Отдай дела нам, а сама — за прялку или в монастырь».",options:[{text:"Не уступать",effects:[{t:"check",s:"stewardship",dc:6,ok:[{t:"prestige",v:8}],fail:[{t:"wealthPct",v:-.1},{t:"prestige",v:-3}],okText:"Хозяйство идёт лучше прежнего — родня мужа умолкла.",failText:"Родня мужа отсудила часть имущества."}]},{text:"Отдать им часть дел",effects:[{t:"income",v:-.3},{t:"opinion",v:10,to:"family"}],result:"Мир в доме, но часть доходов теперь уходит им."}]},{id:"old_tales",title:"Рассказы у очага",weight:5,cooldown:10,cond:{age:[60,110]},text:"Внуки и молодёжь просят рассказать о былом: о войнах, о дедах, о том, как жили раньше.",options:[{text:"Рассказывать до ночи",effects:[{t:"prestige",v:3},{t:"opinion",v:5,to:"family"}],result:"Ваши истории будут пересказывать и после вас."},{text:"«Нечего ворошить старое»",effects:[],result:"Молодёжь расходится разочарованной."}]},{id:"old_will",title:"Завещание",weight:4,cooldown:40,cond:{age:[58,110]},text:"Годы берут своё. Пора заранее объявить последнюю волю — при свидетелях или на бумаге, — чтобы дети не передрались.",options:[{text:"Всё главному наследнику, младшим — по обычаю",effects:[{t:"prestige",v:2},{t:"opinion",v:-5,to:"family"}],result:"Главный наследник спокоен, младшие обижены."},{text:"Поровну всем детям",effects:[{t:"opinion",v:10,to:"family"}],result:"Дети довольны, но род может раздробиться."},{text:"Щедрый вклад на храм или бедных",effects:[{t:"wealthPct",v:-.1},{t:"prestige",v:10}],result:"О вашей щедрости будут помнить."}]},{id:"old_ailment",title:"Старческая хворь",weight:4,cooldown:6,cond:{age:[62,110]},text:"Ноют кости, слабеют глаза, по утрам трудно встать.",options:[{text:"Звать лекаря",effects:[{t:"income",v:-.1},{t:"chance",p:.5,ok:[],fail:[{t:"health",v:-1}],okText:"Лекарь облегчил боль.",failText:"Лекарь развёл руками: годы не лечатся."}]},{text:"Терпеть",effects:[{t:"health",v:-1}],result:"Вы терпите — как терпели отцы."}]},{id:"monsoon_fail",title:"Муссон запоздал",weight:5,cooldown:8,cond:{regions:["india"],year:[800,1950]},text:"Дожди не пришли вовремя: рис сохнет на полях, цены на зерно растут с каждой неделей.",options:[{text:"Открыть свои амбары соседям",effects:[{t:"income",v:-.3},{t:"prestige",v:8},{t:"opinion",v:10,to:"neighbor"}],result:"Соседи не забудут, кто кормил их в засуху."},{text:"Продать зерно по новой цене",effects:[{t:"income",v:.3},{t:"prestige",v:-4}],result:"Выгодно. Но в деревне вас теперь зовут кровопийцей."}]},{id:"caste_feast",title:"Свадебный пир по обычаю",weight:4,cooldown:12,cond:{regions:["india"],religions:["hindu"],hasChild:!0,year:[800,1950]},text:"Женят сына соседа из вашей джати. По обычаю гости приносят дары, а знатный гость — особенно щедрые: о дарах будут говорить годами.",options:[{text:"Щедрый дар",effects:[{t:"income",v:-.2},{t:"prestige",v:6}],result:"Ваш дар обсуждают по всей округе."},{text:"Скромный дар",effects:[{t:"prestige",v:-1}],result:"Приличия соблюдены, не больше."}]},{id:"salt_gold",title:"Соль за золото",weight:5,cooldown:6,cond:{regions:["west_africa","north_africa"],year:[800,1600]},text:"Пришёл караван из-за Сахары: верблюды гружены плитами соли из Тагазы. На юге соль ценится на вес золота.",options:[{text:"Вложиться в перепродажу соли",effects:[{t:"chance",p:.65,ok:[{t:"income",v:.5}],fail:[{t:"income",v:-.3}],okText:"Соль ушла на юг втрое дороже.",failText:"Пока везли, цена упала: другие караваны успели раньше."}]},{text:"Не рисковать",effects:[],result:"Караван уходит дальше."}]},{id:"griot",title:"Гриот",weight:4,cooldown:10,cond:{regions:["west_africa"],year:[800,1950]},text:"Гриот — хранитель родословных и певец — предлагает сложить песню о вашем роде. Песни гриотов помнят веками; молчание гриота — тоже приговор.",options:[{text:"Щедро одарить гриота",effects:[{t:"income",v:-.15},{t:"prestige",v:8}],result:"Песню о вашем роде поют на рынках."},{text:"Отказать",effects:[{t:"prestige",v:-3}],result:"Гриот уходит и поёт о других."}]},{id:"ballgame",title:"Игра в мяч",weight:4,cooldown:8,cond:{regions:["mesoamerica"],year:[800,1521],age:[16,40]},text:"На площадке у храма будет священная игра в тяжёлый каучуковый мяч — его нельзя касаться руками. Знатные ставят на исход перья кецаля и нефрит.",options:[{text:"Выйти играть самому",effects:[{t:"check",s:"martial",dc:7,ok:[{t:"prestige",v:10}],fail:[{t:"health",v:-1}],okText:"Ваша команда победила: о вас говорят жрецы.",failText:"Мяч весом с камень сломал вам рёбра."}]},{text:"Сделать ставку",effects:[{t:"chance",p:.5,ok:[{t:"income",v:.2}],fail:[{t:"income",v:-.2}],okText:"Ставка сыграла.",failText:"Ставка проиграна."}]},{text:"Просто смотреть",effects:[],result:"Зрелище стоит того."}]},{id:"mita",title:"Мита: трудовая повинность",weight:5,cooldown:10,cond:{regions:["south_america"],year:[1450,1812],rank:[0,2]},text:"Пришёл черёд вашей общины отправлять людей на миту — работу на государство (у испанцев — в серебряные рудники Потоси, откуда мало кто возвращается).",options:[{text:"Отправить своих",effects:[{t:"chance",p:.2,ok:[{t:"income",v:-.4}],fail:[{t:"income",v:-.1}],okText:"Из рудника вернулись не все — хозяйство обезлюдело.",failText:"Повинность отбыта."}]},{text:"Откупиться серебром",effects:[{t:"income",v:-.35}],result:"Откуп дорог, но люди дома."}]},{id:"potlatch",title:"Потлач",weight:4,cooldown:12,cond:{regions:["north_america"],religions:["native_faith","animist"],year:[800,1885]},text:"Соседний вождь устроил потлач — пир, на котором хозяин раздаёт богатство, чтобы показать своё величие. Теперь ждут, ответите ли вы ещё более щедрым потлачем.",options:[{text:"Устроить ответный потлач",effects:[{t:"wealthPct",v:-.2},{t:"prestige",v:15}],result:"Вы раздали больше, чем он. Ваше имя выше его имени."},{text:"Не отвечать",effects:[{t:"prestige",v:-6}],result:"Род потерял лицо."}]},{id:"land_converts_secular",title:"Время без Бога",text:"Власть и школа объявили веру пережитком. В храм ходить не запрещено, но тем, кто ходит, труднее с работой и учёбой.",weight:0,options:[{text:"Жить без веры, как все",effects:[{t:"religion",v:"local"},{t:"prestige",v:3},{t:"opinion",v:10,to:"lord"}],result:"Род отложил веру — по крайней мере на людях."},{text:"Держаться веры отцов",effects:[{t:"flag",v:"foreign_faith"},{t:"prestige",v:-5},{t:"opinion",v:-15,to:"lord"}],result:"Вы остаётесь при старой вере — и при поборах, косых взглядах и подозрениях."}]},{id:"land_converts_islam",title:"Земля принимает ислам",text:"Правитель и знать приняли ислам, за ними — города и кочевья. Тех, кто держится старой веры, облагают податью и спрашивают, чьи они.",weight:0,options:[{text:"Принять веру земли",effects:[{t:"religion",v:"local"},{t:"prestige",v:3},{t:"opinion",v:10,to:"lord"}],result:"Род принял новую веру вместе со всеми."},{text:"Держаться веры отцов",effects:[{t:"flag",v:"foreign_faith"},{t:"prestige",v:-5},{t:"opinion",v:-15,to:"lord"}],result:"Вы остаётесь при старой вере — и при поборах, косых взглядах и подозрениях."}]},{id:"land_converts_protestant",title:"Разрыв с Римом",text:"Государь порвал с Римом: службу служат по-новому, монастыри закрыты. Приходский священник спрашивает, какой веры ваш дом.",weight:0,options:[{text:"Принять веру земли",effects:[{t:"religion",v:"local"},{t:"prestige",v:3},{t:"opinion",v:10,to:"lord"}],result:"Род принял новую веру вместе со всеми."},{text:"Держаться веры отцов",effects:[{t:"flag",v:"foreign_faith"},{t:"prestige",v:-5},{t:"opinion",v:-15,to:"lord"}],result:"Вы остаётесь при старой вере — и при поборах, косых взглядах и подозрениях."}]},{id:"prodigal",title:"Мот",text:"{target} спускает деньги семьи: кости, вино, дорогие наряды и сомнительные друзья. Кредиторы уже стучат в дверь.",weight:12,cooldown:10,target:"child",cond:{childAge:[16,35],richYears:2},options:[{text:"Оплатить долги — честь семьи дороже",effects:[{t:"wealthPct",v:-.2},{t:"chance",p:.5,ok:[{t:"trait",add:"drunkard",who:"target"}],fail:[]}]},{text:"Отказать и пусть отвечает сам",effects:[{t:"prestige",v:-8},{t:"chance",p:.5,ok:[{t:"trait",add:"diligent",who:"target"}],fail:[{t:"trait",add:"deceitful",who:"target"}]}],result:"Кредиторы позорят семью на рынке."},{text:"Отправить на службу подальше",effects:[{t:"wealthPct",v:-.05},{t:"stat",s:"martial",v:2,who:"target"}]}]}],ov=[{id:"charlemagne_crowned",year:800,week:51,title:"Карл Великий коронован императором",text:"В Рождество 800 года папа Лев III возложил на голову короля франков Карла императорскую корону. На Западе вновь есть император.",regions:["francia","italy","britain","iberia"],map:[{key:"carolingian_empire",name:"Империя Карла Великого"}]},{id:"viking_age",year:810,jitter:3,title:"Эпоха викингов",text:"С севера всё чаще приходят длинные корабли. Монастыри и прибрежные города горят. Никто не знает, где северяне ударят в следующий раз.",regions:["britain","francia","scandinavia"],rumor:"Говорят, на севере живут морские разбойники, что молятся одноглазому богу.",trouble:{kind:"war",years:6,regions:["britain","francia"],name:"Набеги викингов"}},{id:"treaty_verdun",year:843,title:"Верденский договор",text:"Внуки Карла Великого поделили империю на три королевства. Западная часть отошла Карлу Лысому, восточная — Людовику Немецкому.",regions:["francia","italy"],map:[{key:"carolingian_empire",name:"Западно-Франкское королевство"},{key:"carolingian_empire_2",name:"Срединное королевство Лотаря"}]},{id:"rurik",year:862,title:"Призвание варягов",text:"По летописи, славяне и чудь призвали варяга Рюрика княжить в Новгороде.",regions:["rus","scandinavia"],map:[{key:"rus_khaganate",name:"Новгородская земля"}]},{id:"cyril_methodius",year:863,title:"Кирилл и Мефодий",text:"Братья из Солуни создают славянскую азбуку и несут Писание славянам на их родном языке.",regions:["east_europe","balkans","rus"]},{id:"bulgaria_baptism",year:864,title:"Крещение Болгарии",text:"Князь Борис принял крещение от Константинополя. Болгары входят в христианский мир Востока.",regions:["balkans","east_europe"],convert:{from:["tengri","slavic_pagan","pagan"],to:"orthodox",countries:["bulgars"]}},{id:"great_army",year:865,jitter:1,title:"Великая языческая армия",text:"Огромное войско данов высадилось в Англии. Нортумбрия и восточные земли пали.",regions:["britain","scandinavia"],map:[{key:"northumbria",name:"Данелаг",owner:"danes"},{key:"essex",owner:"danes"}],mortality:{regions:["britain"],rate:.04,cause:"убит данами",menOnly:!0,ages:[15,60]}},{id:"kievan_rus",year:882,title:"Возникновение Древней Руси",text:"Князь Олег объединил Новгород и Киев. На великом пути «из варяг в греки» рождается новая держава.",regions:["rus","east_europe","balkans","scandinavia"],map:[{key:"rus_khaganate",name:"Киевская Русь"}]},{id:"magyar_conquest",year:895,jitter:2,title:"Обретение родины мадьярами",text:"Мадьяры перешли Карпаты и заняли Паннонию. Их конные набеги наводят ужас на всю Европу.",regions:["east_europe","steppe","francia","italy"],map:[{key:"avars",name:"Венгерское княжество",owner:"magyars"},{key:"magyars",name:"Венгерское княжество"}],trouble:{kind:"war",years:4,name:"Набеги мадьяр"}},{id:"tang_fall",year:907,title:"Падение династии Тан",text:"Великая Тан пала. Китай распался на Пять династий и Десять царств.",regions:["china","central_asia","korea","japan"],map:[{key:"tang_empire",name:"Пять династий и десять царств"}]},{id:"normandy",year:911,title:"Основание Нормандии",text:"Король франков отдал викингу Роллону земли в устье Сены. Северяне становятся норманнами.",regions:["francia","scandinavia","britain"]},{id:"goryeo",year:918,title:"Корё",text:"Ван Гон основал государство Корё, которое вскоре объединит Корейский полуостров.",regions:["korea","china"],map:[{key:"silia",name:"Корё"},{key:"parhae",name:"Киданьская империя Ляо"}]},{id:"volga_islam",year:922,title:"Булгары принимают ислам",text:"К правителю Волжской Булгарии прибыло посольство багдадского халифа — с ним Ибн Фадлан. Булгары принимают ислам.",regions:["rus","steppe","middle_east"],convert:{from:["tengri","pagan"],to:"islam",countries:["volga_bulgars"]}},{id:"england",year:927,title:"Королевство Англия",text:"Король Этельстан объединил англосаксонские королевства под своей властью.",regions:["britain"],map:[{key:"wessex",name:"Королевство Англия"},{key:"mercia",owner:"wessex"},{key:"kent",owner:"wessex"},{key:"essex",owner:"wessex"},{key:"northumbria",owner:"wessex"}]},{id:"song",year:960,title:"Империя Сун",text:"Чжао Куанъинь основал династию Сун. Начинается расцвет торговли, книгопечатания и учёности.",regions:["china","central_asia","korea","japan","se_asia"],map:[{key:"tang_empire",name:"Империя Сун"}]},{id:"hre",year:962,title:"Священная Римская империя",text:"Оттон I коронован в Риме. Восточно-франкское королевство становится империей.",regions:["francia","italy","east_europe"],map:[{key:"carolingian_empire_2",name:"Священная Римская империя"},{key:"lombard_duchies",owner:"carolingian_empire_2"}]},{id:"poland",year:966,title:"Крещение Польши",text:"Князь Мешко I принял крещение. Польские земли входят в христианский мир Запада.",regions:["east_europe"],map:[{key:"slavonic_tribes",name:"Польское княжество"}],convert:{from:["slavic_pagan"],to:"christian",countries:["slavonic_tribes","czechs"]}},{id:"france",year:987,title:"Королевство Франция",text:"Гуго Капет избран королём западных франков. Его потомки будут править Францией восемь веков.",regions:["francia","britain","italy","iberia"],map:[{key:"carolingian_empire",name:"Королевство Франция"}]},{id:"baptism_rus",year:988,title:"Крещение Руси",text:"Князь Владимир принял христианство из Царьграда и велел креститься всему народу.",regions:["rus","balkans"],affected:{cond:{regions:["rus","east_europe"],religions:["slavic_pagan","pagan"]},options:[{text:"Креститься вместе со всеми",effects:[{t:"religion",v:"orthodox"},{t:"prestige",v:3}]},{text:"Остаться верным старым богам",effects:[{t:"prestige",v:-5},{t:"trait",add:"pious"}],result:"Соседи сторонятся вашего рода."}]},convert:{from:["slavic_pagan"],to:"orthodox",regions:["rus"]}},{id:"hungary_kingdom",year:1e3,title:"Королевство Венгрия",text:"Иштван I коронован короной, присланной папой. Мадьяры становятся христианским народом.",regions:["east_europe","steppe"],map:[{key:"magyars",name:"Королевство Венгрия"}],convert:{from:["tengri"],to:"christian",countries:["magyars","avars"]}},{id:"vinland",year:1e3,jitter:2,title:"Винланд",text:"Лейф Эрикссон доплыл до неведомых земель далеко на западе, за Гренландией, и назвал их Винланд.",regions:["scandinavia"],rumor:"Северяне рассказывают сказки о «Винной земле» за западным океаном.",affected:{cond:{regions:["scandinavia"]},options:[{text:"Удивительно!",effects:[{t:"learn",n:1,level:1,far:!0}]}]}},{id:"christianize_north",year:1e3,jitter:5,title:"Крещение Севера",text:"Короли Дании, Норвегии и Швеции один за другим принимают христианство. Старые капища разрушаются.",regions:["scandinavia"],affected:{cond:{religions:["norse_pagan"]},options:[{text:"Принять Христа",effects:[{t:"religion",v:"christian"},{t:"prestige",v:3}]},{text:"Остаться с асами",effects:[{t:"prestige",v:-8}],result:"Вы — одни из последних почитателей Одина."}]},convert:{from:["norse_pagan"],to:"christian",regions:["scandinavia"]}},{id:"cnut",year:1016,title:"Северная империя Кнуда",text:"Датский король Кнуд Великий завоевал Англию и правит империей Северного моря.",regions:["britain","scandinavia"],map:[{key:"danes",name:"Империя Кнуда Великого"}]},{id:"schism",year:1054,title:"Великий раскол",text:"Папский легат и патриарх Константинопольский предали друг друга анафеме. Христианский мир раскололся на Запад и Восток.",regions:["francia","italy","balkans","rus","britain","iberia","east_europe","scandinavia"]},{id:"cumans_rus",year:1061,title:"Половцы",text:"Из степи пришли половцы. Набеги на южные земли Руси будут повторяться полтора века: горят сёла, людей уводят в полон.",regions:["rus","steppe"],trouble:{kind:"war",years:4,name:"Набеги половцев"}},{id:"norman_conquest",year:1066,title:"Нормандское завоевание",text:"Вильгельм Нормандский разбил короля Гарольда при Гастингсе. В Англии воцаряются норманны, а с ними — французский язык и замки.",regions:["britain","francia","scandinavia"],map:[{key:"wessex",name:"Англо-Нормандское королевство"}],mortality:{regions:["britain"],rate:.03,cause:"погиб в войнах Нормандского завоевания",menOnly:!0,ages:[16,55]}},{id:"manzikert",year:1071,title:"Битва при Манцикерте",text:"Сельджуки разгромили византийскую армию. Анатолия открыта для тюрок.",regions:["balkans","middle_east"],map:[{key:"abbasid_caliphate",name:"Империя Сельджуков"}],trouble:{kind:"war",years:3,name:"Вторжение сельджуков"}},{id:"investiture",year:1077,title:"Каносса",text:"Император Генрих IV три дня стоял босым у ворот замка Каносса, вымаливая у папы Григория VII снятия отлучения. Спор о том, кто главнее — папа или император, раскалывает Запад.",regions:["francia","italy","east_europe"]},{id:"first_crusade",year:1099,title:"Взятие Иерусалима",text:"Рыцари Первого крестового похода штурмом взяли Иерусалим. На Востоке возникают государства крестоносцев.",regions:["francia","italy","balkans","middle_east","britain","iberia"]},{id:"anarchy_england",year:1138,title:"Анархия в Англии",text:"Стефан и Матильда воюют за английскую корону. Хронист пишет: «Люди говорили открыто, что Христос и святые его спят».",regions:["britain"],trouble:{kind:"war",years:8,name:"Анархия: война за корону"}},{id:"second_crusade",year:1147,title:"Второй крестовый поход",text:"Короли Франции и Германии ведут войска на Восток. Поход кончится неудачей под Дамаском.",regions:["francia","italy","east_europe","middle_east","balkans"],mortality:{regions:["francia"],rate:.02,cause:"погиб в крестовом походе",menOnly:!0,ages:[16,50]}},{id:"wendish_crusade",year:1147,title:"Крестовый поход против вендов",text:"Саксонские и датские рыцари идут на язычников — полабских славян: бодричей и лютичей. Последняя твердыня старых богов, Аркона на Рюгене, падёт в 1168 году.",regions:["east_europe","scandinavia"],trouble:{kind:"war",years:1,regions:["east_europe"]}},{id:"saladin",year:1187,title:"Саладин берёт Иерусалим",text:"Султан Салах ад-Дин разбил крестоносцев при Хаттине и вошёл в Иерусалим. Запад собирает Третий крестовый поход.",regions:["middle_east","francia","italy","britain","east_europe"],trouble:{kind:"war",years:3,regions:["middle_east"],name:"Война за Иерусалим"}},{id:"genghis",year:1206,title:"Чингисхан",text:"На курултае Тэмуджин провозглашён Чингисханом — владыкой всех монголов. Степь содрогается.",regions:["steppe","central_asia","china","siberia"],map:[{key:"uyghurs",name:"Монгольская империя"},{key:"tungus",owner:"uyghurs"}],rumor:"Где-то далеко на востоке, говорят, поднялся страшный народ — татары.",trouble:{kind:"war",years:5,name:"Монгольские походы"}},{id:"livonian_crusade",year:1208,title:"Крестоносцы в Ливонии",text:"Меченосцы и датчане огнём и мечом крестят эстов и ливов.",regions:["east_europe","scandinavia","rus"],convert:{from:["pagan","slavic_pagan","norse_pagan","animist"],to:"christian",countries:["ests"]}},{id:"magna_carta",year:1215,title:"Великая хартия вольностей",text:"Бароны заставили короля Иоанна скрепить печатью хартию, ограничившую власть короны.",regions:["britain"]},{id:"karelia_baptism",year:1227,title:"Крещение карел",text:"Новгородский князь Ярослав послал священников крестить карел.",regions:["rus","scandinavia"],convert:{from:["pagan","animist"],to:"orthodox",countries:["karelians"]}},{id:"mongol_rus",year:1237,jitter:1,title:"Нашествие Батыя",text:"Монгольские тумены сожгли Рязань, Владимир, затем Киев. Русские земли попали под власть Орды.",regions:["rus","east_europe","steppe"],map:[{key:"rus_khaganate",name:"Русские княжества (под властью Орды)"},{key:"volga_bulgars",name:"Золотая Орда"},{key:"khazars",owner:"volga_bulgars"},{key:"bashkirs",owner:"volga_bulgars"}],mortality:{regions:["rus"],rate:.12,cause:"погиб при нашествии Батыя"}},{id:"finland_crusade",year:1249,title:"Шведы в Финляндии",text:"Шведские походы приводят финнов в римскую веру.",regions:["scandinavia","rus"],convert:{from:["pagan","animist","norse_pagan"],to:"christian",countries:["finns"]}},{id:"baghdad_fall",year:1258,title:"Падение Багдада",text:"Хулагу-хан взял Багдад и казнил халифа. Город мира разорён, книги Дома мудрости брошены в Тигр.",regions:["middle_east","central_asia"],map:[{key:"abbasid_caliphate",name:"Государство Хулагуидов"}],mortality:{regions:["middle_east"],rate:.1,cause:"убит монголами"}},{id:"yuan",year:1271,title:"Империя Юань",text:"Хубилай-хан провозгласил династию Юань и покорил Китай.",regions:["china","korea","central_asia","japan"],map:[{key:"tang_empire",name:"Империя Юань"}]},{id:"marco_polo",year:1295,title:"Путешествие Марко Поло",text:"Венецианец Марко Поло вернулся из Китая и рассказывает о Великом хане, бумажных деньгах и городах в миллион душ.",regions:["italy","francia","balkans"],knowledge:{level:1,regions:["china","central_asia","india"],forWorlds:["old"]}},{id:"golden_horde_islam",year:1313,title:"Орда принимает ислам",text:"Хан Узбек сделал ислам верой Золотой Орды.",regions:["steppe","rus"],convert:{from:["tengri"],to:"islam",regions:["steppe"]}},{id:"famine_1315",year:1315,title:"Великий голод",text:"Три года подряд дожди губят урожай по всей Северной Европе. Хлеб дорожает втрое-вчетверо, местами и в восемь раз, хронисты пишут о людоедстве.",regions:["francia","britain","scandinavia","east_europe"],trouble:{kind:"famine",years:3},mortality:{rate:.05,cause:"голод",regions:["francia","britain","scandinavia","east_europe"]}},{id:"mali",year:1324,title:"Хадж Мансы Мусы",text:"Правитель Мали Манса Муса прошёл через Каир с таким количеством золота, что цены на него рухнули на годы.",regions:["west_africa","north_africa","middle_east"],map:[{key:"ghana",name:"Империя Мали"}],convert:{from:["animist"],to:"islam",countries:["ghana","kanem"]}},{id:"hundred_years",year:1337,title:"Столетняя война",text:"Английский король Эдуард III заявил права на французский трон. Начинается война, что продлится больше века.",regions:["francia","britain"],mortality:{regions:["francia"],rate:.03,cause:"погиб в Столетней войне",menOnly:!0,ages:[16,50]}},{id:"bardi",year:1345,title:"Крах банков Барди и Перуцци",text:"Король Англии Эдуард III отказался платить долги флорентийским банкирам. Крупнейшие банки Европы лопнули, увлекая за собой вкладчиков.",regions:["italy","francia","britain"],affected:{cond:{richYears:2,rank:[2,7],regions:["italy","francia","britain"]},text:"Часть ваших денег лежала у флорентийцев.",options:[{text:"Проклятые банкиры!",effects:[{t:"wealthPct",v:-.3}]}]}},{id:"black_death",year:1347,title:"Чёрная смерть",text:"С Востока пришла моровая язва. Люди умирают за три дня, деревни пустеют, мёртвых не успевают хоронить. Погибла треть Европы.",regions:["francia","italy","britain","iberia","scandinavia","east_europe","balkans","middle_east","north_africa","rus"],mortality:{rate:.3,cause:"чума",regions:["francia","italy","britain","iberia","scandinavia","east_europe","balkans","middle_east","north_africa","rus"]}},{id:"ming",year:1368,title:"Империя Мин",text:"Восстание Красных повязок изгнало монголов. Чжу Юаньчжан основал династию Мин.",regions:["china","korea","central_asia","se_asia","japan"],map:[{key:"tang_empire",name:"Империя Мин"},{key:"hainan",owner:"tang_empire"}]},{id:"northern_yuan",year:1368,title:"Монголы уходят в степь",text:"После падения Юань монгольская знать вернулась в родные степи. Империя распалась на враждующие ханства.",regions:["steppe","central_asia","china"],map:[{key:"uyghurs",name:"Монгольские ханства"},{key:"tungus",owner:""}]},{id:"timur",year:1370,title:"Тамерлан",text:"Хромой эмир Тимур не Чингизид и ханом назваться не может — он правит от имени подставных ханов, взяв в жёны царевну из рода Чингиса. Его походы от Дели до Анкары оставляют пирамиды из черепов.",regions:["central_asia","middle_east","india","steppe","rus"],mortality:{regions:["central_asia"],rate:.05,cause:"убит воинами Тамерлана"}},{id:"kulikovo",year:1380,title:"Куликовская битва",text:"Московский князь Дмитрий разбил Мамая на Куликовом поле. Власть Орды пошатнулась.",regions:["rus","steppe"],trouble:{kind:"war",years:1}},{id:"lithuania_baptism",year:1387,title:"Крещение Литвы",text:"Великий князь Ягайло, ставший королём Польши, крестит Литву — последнюю языческую страну Европы.",regions:["east_europe"],convert:{from:["pagan"],to:"christian",countries:["baltic_tribes"]}},{id:"joseon",year:1392,title:"Чосон",text:"Ли Сонгэ основал династию Чосон, что будет править Кореей пять веков.",regions:["korea","china","japan"],map:[{key:"silia",name:"Чосон"}]},{id:"printing",year:1450,jitter:3,title:"Печатный станок",text:"В Майнце Иоганн Гутенберг печатает книги подвижными литерами. Книги дешевеют в десятки раз, знания расходятся по свету.",regions:["francia","italy","britain","iberia","east_europe","scandinavia"],knowledge:{level:1,regions:["francia","italy","britain","iberia","east_europe","scandinavia","balkans","rus","middle_east","north_africa"],forWorlds:["old"]}},{id:"constantinople",year:1453,title:"Падение Константинополя",text:"Султан Мехмед II взял Константинополь. Тысячелетняя Византия пала, город стал столицей Османов.",regions:["balkans","middle_east","italy","rus","east_europe"],map:[{key:"byzantine_empire",name:"Османская империя"},{key:"bulgars",owner:"byzantine_empire"}],trouble:{kind:"war",years:2,regions:["balkans"],name:"Османское завоевание"},convert:{from:["orthodox"],to:"islam",countries:["byzantine_empire"]}},{id:"ugra",year:1480,title:"Стояние на Угре",text:"Иван III отказался платить дань. Русь освободилась от власти Орды.",regions:["rus","steppe"],map:[{key:"rus_khaganate",name:"Великое княжество Московское"}]},{id:"reconquista",year:1492,title:"Конец Реконкисты",text:"Католические короли взяли Гранаду. Испания объединена, мусульманское владычество на полуострове окончено.",regions:["iberia","north_africa","italy","francia"],map:[{key:"asturias",name:"Королевство Испания"},{key:"emirate_of_cordoba",owner:"asturias"}]},{id:"columbus",year:1492,title:"Открытие Нового Света",text:"Генуэзец Христофор Колумб на испанских кораблях пересёк океан и достиг неведомых островов на западе. Мир оказался больше, чем думали.",knowledge:{level:1,worlds:["americas"],forWorlds:["old"]},affected:{cond:{worlds:["americas"]},options:[{text:"Кто эти бледные люди на огромных лодках?",effects:[{t:"learn",n:1,level:1,far:!0}]}]}},{id:"vasco",year:1498,title:"Морской путь в Индию",text:"Васко да Гама обогнул Африку и достиг Индии. Пряности потекли в Европу по морю.",regions:["iberia","india","east_africa"],knowledge:{level:1,regions:["india","east_africa","south_africa"],forWorlds:["old"]}},{id:"safavid",year:1501,title:"Сефевидская Персия",text:"Шах Исмаил I основал державу Сефевидов и сделал шиизм государственной верой Ирана.",regions:["middle_east","central_asia"],map:[{key:"abbasid_caliphate",name:"Сефевидская Персия"}]},{id:"reformation",year:1517,title:"Реформация",text:"Монах Мартин Лютер прибил к дверям церкви 95 тезисов. Христианский Запад раскалывается снова.",regions:["francia","britain","scandinavia","east_europe","italy"],affected:{cond:{religions:["christian"],regions:["francia","britain","scandinavia","east_europe"]},options:[{text:"Остаться верными Риму",effects:[{t:"prestige",v:2}]},{text:"Принять учение Лютера",effects:[{t:"religion",v:"protestant"},{t:"stat",s:"learning",v:1}]}]},convert:{from:["christian"],to:"protestant",regions:["scandinavia"]}},{id:"ottoman_arabia",year:1517,title:"Османы покоряют Египет",text:"Султан Селим I разгромил мамлюков. Мекка, Медина и Каир — под властью Стамбула.",regions:["middle_east","north_africa","balkans"],map:[{key:"aghlabid_emirate",owner:"byzantine_empire"},{key:"makkura",owner:"byzantine_empire"}]},{id:"aztec_conquest",year:1521,title:"Падение Теночтитлана",text:"Конкистадоры Кортеса и их союзники взяли столицу ацтеков. Рождается Новая Испания.",regions:["mesoamerica","iberia","caribbean"],map:[{key:"toltec_empire",name:"Новая Испания"},{key:"mesoamerican_city_states_and_chiefdoms",owner:"toltec_empire"},{key:"mixtecs",owner:"toltec_empire"},{key:"maya_city_states",owner:"toltec_empire"}],mortality:{regions:["mesoamerica","caribbean"],rate:.35,cause:"оспа, принесённая чужеземцами"}},{id:"magellan",year:1522,title:"Первое кругосветное плавание",text:"Корабль экспедиции Магеллана вернулся, обогнув весь шар земной.",regions:["iberia","italy","francia","britain"],knowledge:{level:1,all:!0,forWorlds:["old"]}},{id:"inca_conquest",year:1533,title:"Гибель империи инков",text:"Писарро казнил Атауальпу. Анды становятся владением испанской короны.",regions:["south_america","iberia"],map:[{key:"huari_empire",name:"Вице-королевство Перу"},{key:"tiahuanaco_empire",owner:"huari_empire"}],mortality:{regions:["south_america"],rate:.25,cause:"оспа и война конкис
